name: CI
on:
  push:
    branches: [main, dev]
    tags: ["*"]
  pull_request:
permissions:
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1' # automatically expands to the latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macOS-15-intel
          - windows-latest
        arch:
          - x64        
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1'
          # the last 1.11 whose optimizer deletes field writes to an escaping mutable: under
          # this job's --check-bounds=yes it takes the fallback span reconstruction of 1.10
          - os: ubuntu-latest
            arch: x64
            version: '1.11.4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: actions/cache@v6
        with:
          path: test/data/w3c
          key: w3c-xmlconf-v20130923
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  test-default-bounds:
    # The build users actually run: --check-bounds=auto makes the load-time selection
    # compile the noshift span reconstruction (the test job's --check-bounds=yes
    # compiles the checked branch instead, leaving the user-facing path untested), and
    # coverage off lets the numeric allocation guards assert (coverage counters allocate
    # inside the measured calls, so the guards skip themselves under coverage).
    # 'lts' is a third body again: Base has no noshift SubString constructor on 1.10,
    # so that build selects the two-branch fallback under either flag.
    name: Julia ${{ matrix.version }} - ubuntu-latest - x64 - default-bounds allocation guards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: actions/cache@v6
        with:
          path: test/data/w3c
          key: w3c-xmlconf-v20130923
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          check_bounds: 'auto'
