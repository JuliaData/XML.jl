name: Downstream
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "SatelliteToolboxOrbitDataMessages"
          - "XLSX"
        # 'lts' runs the fallback span reconstruction (Base has no noshift SubString
        # constructor on 1.10), a different compiled body than '1' — and dependents are
        # the only callers large enough to exercise it the way users do.
        version:
          - '1'
          - 'lts'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
          show-versioninfo: true
      - uses: julia-actions/julia-buildpkg@latest
      - name: Load this and run the downstream tests
        shell: julia --color=yes {0}
        run: |
          # force it to use this PR's version of the package
          ENV["JULIA_PKG_DEVDIR"] = mktempdir()
          # Don't waste time precompiling before the test
          ENV["JULIA_PKG_PRECOMPILE_AUTO"] = "0"
          using Pkg
          Pkg.Registry.update()
          Pkg.activate(;temp=true)
          Pkg.develop([
            PackageSpec(path="."),
            PackageSpec(name="${{ matrix.package }}"),
          ])
          Pkg.update()
          Pkg.test("${{ matrix.package }}")
