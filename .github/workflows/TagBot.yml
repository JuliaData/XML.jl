name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # TagBot's default template (Jinja2) up to the release notes, without the
          # lists of merged pull requests and closed issues that follow: they
          # duplicate the notes, and the history lives in the CHANGELOG.
          changelog: |
            ## {{ package }} {{ version }}
            {% if yanked %}

            :warning: **This release has been yanked from the registry.**
            {% endif -%}
            {% if previous_release %}

            [Diff since {{ previous_release }}]({{ compare_url }})
            {% endif %}

            {% if custom %}
            {{ custom }}
            {% endif %}
