name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          # Release body = the registration comment's notes + diff link only — no
          # auto-generated "Merged pull requests" / "Closed issues" lists (they
          # duplicate the notes; the history lives in the CHANGELOG).
          changelog: |
            ## {{ package }} {{ version }}

            [Diff since {{ previous_release }}]({{ compare_url }})

            {{# custom }}
            {{{ custom }}}
            {{/ custom }}
